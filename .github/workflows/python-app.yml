name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t taskflow:ci .
      - name: Smoke test
        run: |
          docker run -d --name tf -p 5000:5000 taskflow:ci
          for i in $(seq 1 15); do curl -fs http://localhost:5000/health && exit 0; sleep 1; done
          docker logs tf; exit 1

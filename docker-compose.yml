services:
  web:
    build:
      context: .
      target: runtime
    image: taskflow:latest
    container_name: taskflow
    ports:
      - "${HOST_PORT:-5000}:5000"
    environment:
      PORT: "5000"
    restart: unless-stopped

  # Run the test suite:  docker compose --profile test run --rm test
  test:
    build:
      context: .
      target: test
    profiles: ["test"]
